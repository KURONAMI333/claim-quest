plugins {
    id 'fabric-loom' version '1.17.21'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
}

sourceSets {
    main {
        resources.srcDir('../../src/main/resources')
    }
    // Isolated dev-only acceptance sources; jar continues to package main.output only.
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modCompileOnly "dev.ftb.mods:ftb-quests-fabric:${ftb_quests_version}"
    modCompileOnly "dev.ftb.mods:ftb-chunks-fabric:${ftb_chunks_version}"
    modCompileOnly "dev.ftb.mods:ftb-teams-fabric:${ftb_teams_version}"
    modCompileOnly "dev.ftb.mods:ftb-library-fabric:${ftb_library_version}"

    if (!project.hasProperty('withoutFtb')) {
        modRuntimeOnly "dev.ftb.mods:ftb-quests-fabric:${ftb_quests_version}"
        modRuntimeOnly "dev.ftb.mods:ftb-teams-fabric:${ftb_teams_version}"
        modRuntimeOnly "dev.ftb.mods:ftb-library-fabric:${ftb_library_version}"
        if (!project.hasProperty('withoutFtbChunks')) {
            modRuntimeOnly "dev.ftb.mods:ftb-chunks-fabric:${ftb_chunks_version}"
        }
    }
}

processResources {
    inputs.properties([
            version: project.version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_authors: mod_authors,
            mod_description: mod_description,
            minecraft_version: minecraft_version,
            fabric_loader_version: fabric_loader_version,
            fabric_loader_min_version: fabric_loader_min_version,
    ])
    filesMatching('fabric.mod.json') {
        expand inputs.properties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar', Jar).configure {
    inputs.file('../../LICENSE')
    from('../../LICENSE') {
        rename { "LICENSE_${mod_id}" }
    }
}

def claimQuestFixtureMode = project.hasProperty('withoutFtb') ? 'without-ftb' :
        (project.hasProperty('withoutFtbChunks') ? 'without-ftb-chunks' : 'full')

loom {
    mods {
        claimquest { sourceSet sourceSets.main }
        claimquest_fabric1211_gametest { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            server()
            setConfigName('Claim Quest Fabric GameTests')
            ideConfigGenerated(true)
            runDir('runs/gametest')
            source sourceSets.gametest
            vmArg '-Dfabric-api.gametest=true'
            vmArg "-Dclaimquest.fixture.mode=${claimQuestFixtureMode}"
            vmArg "-Dfabric-api.gametest.report-file=${project.file('runs/gametest-report.xml')}"
        }
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('run/server')
        }
    }
}


// FTB Quests reads development quests from the configured world directory.
def prepareGametestQuests = tasks.register('prepareGametestQuests', Copy) {
    from('src/gametest/questpack') {
        into 'chapters'
    }
    into layout.projectDirectory.dir('runs/gametest/config/ftbquests/quests')
}
tasks.named('runGametest').configure {
    dependsOn prepareGametestQuests
}
tasks.named('check').configure {
    dependsOn tasks.named('gametestClasses')
}
