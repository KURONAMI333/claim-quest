plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0.7-dev-SNAPSHOT'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-forge-1.19.2" }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_mappings_version}-${minecraft_version}"
    runs {
        client {
            workingDirectory file('run/client')
            mods { "${mod_id}" { source sourceSets.main; source sourceSets.gametest } }
        }
        server {
            workingDirectory file('run/server')
            args '--nogui'
            mods { "${mod_id}" { source sourceSets.main; source sourceSets.gametest } }
        }
        gameTestServer {
            workingDirectory file('run/gametest')
            args '--nogui', '--gameTestServer'
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'claimquest.fixture.mode', project.hasProperty('withoutFtb') ? 'without-ftb' : 'full'
            mods { "${mod_id}" { source sourceSets.main; source sourceSets.gametest } }
        }
    }
}

repositories {
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly(fg.deobf("dev.ftb.mods:ftb-quests-forge:${ftb_quests_version}")) {
        exclude group: 'dev.latvian.mods', module: 'item-filters-forge'
    }
    compileOnly fg.deobf("dev.ftb.mods:ftb-chunks-forge:${ftb_chunks_version}")
    compileOnly fg.deobf("dev.ftb.mods:ftb-teams-forge:${ftb_teams_version}")
    compileOnly fg.deobf("dev.ftb.mods:ftb-library-forge:${ftb_library_version}")
    compileOnly fg.deobf("dev.architectury:architectury-forge:${architectury_version}")
    compileOnly fg.deobf("curse.maven:item-filters-309674:${item_filters_file_id}")

    if (!project.hasProperty('withoutFtb')) {
        runtimeOnly(fg.deobf("dev.ftb.mods:ftb-quests-forge:${ftb_quests_version}")) {
            exclude group: 'dev.latvian.mods', module: 'item-filters-forge'
        }
        runtimeOnly fg.deobf("dev.ftb.mods:ftb-chunks-forge:${ftb_chunks_version}")
        runtimeOnly fg.deobf("dev.ftb.mods:ftb-teams-forge:${ftb_teams_version}")
        runtimeOnly fg.deobf("dev.ftb.mods:ftb-library-forge:${ftb_library_version}")
        runtimeOnly fg.deobf("dev.architectury:architectury-forge:${architectury_version}")
        runtimeOnly fg.deobf("curse.maven:item-filters-309674:${item_filters_file_id}")
    }
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('check') { dependsOn tasks.named('compileGametestJava') }

def prepareGameTestQuests = tasks.register('prepareGameTestQuests', Copy) {
    from('src/gametest/questpack') { into 'chapters' }
    into layout.projectDirectory.dir('run/gametest/config/ftbquests/quests')
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn prepareGameTestQuests }

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def props = [mod_id: mod_id, mod_name: mod_name,
                 mod_license: mod_license, mod_version: mod_version,
                 mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.named('jar', Jar).configure {
    inputs.file(file('LICENSE'))
    from('LICENSE') { rename { "LICENSE_${mod_id}" } }
}
jar.finalizedBy('reobfJar')
