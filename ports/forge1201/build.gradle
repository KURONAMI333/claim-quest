plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0.7-dev-SNAPSHOT'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-forge-1.20.1" }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_mappings_version}-${minecraft_version}"
    runs {
        client {
            workingDirectory file('run/client')
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            workingDirectory file('run/server')
            args '--nogui'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        gameTestServer {
            workingDirectory file('run/gametest')
            args '--nogui', '--gameTestServer'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods { "${mod_id}" { source sourceSets.main; source sourceSets.gametest } }
        }
    }
}

repositories {
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // ForgeGradle remaps published SRG-named Forge mods into the official names used by this source.
    compileOnly(fg.deobf("dev.ftb.mods:ftb-quests-forge:${ftb_quests_version}")) { transitive = false }
    compileOnly(fg.deobf("dev.ftb.mods:ftb-chunks-forge:${ftb_chunks_version}")) { transitive = false }
    compileOnly(fg.deobf("dev.ftb.mods:ftb-teams-forge:${ftb_teams_version}")) { transitive = false }
    compileOnly(fg.deobf("dev.ftb.mods:ftb-library-forge:${ftb_library_version}")) { transitive = false }
    compileOnly(fg.deobf("dev.architectury:architectury-forge:${architectury_version}")) { transitive = false }

    // Keep runtime FTB mods optional; -PwithoutFtb leaves only the addon's declared Forge requirements.
    if (!project.hasProperty('withoutFtb')) {
        runtimeOnly(fg.deobf("dev.ftb.mods:ftb-quests-forge:${ftb_quests_version}")) { transitive = false }
        runtimeOnly(fg.deobf("dev.ftb.mods:ftb-chunks-forge:${ftb_chunks_version}")) { transitive = false }
        runtimeOnly(fg.deobf("dev.ftb.mods:ftb-teams-forge:${ftb_teams_version}")) { transitive = false }
        runtimeOnly(fg.deobf("dev.ftb.mods:ftb-library-forge:${ftb_library_version}")) { transitive = false }
        runtimeOnly(fg.deobf("dev.architectury:architectury-forge:${architectury_version}")) { transitive = false }
        runtimeOnly "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"
    }

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('check') { dependsOn tasks.named('compileGametestJava') }

def prepareGameTestQuests = tasks.register('prepareGameTestQuests', Copy) {
    from('src/gametest/questpack') { into 'chapters' }
    into layout.projectDirectory.dir('run/gametest/config/ftbquests/quests')
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn prepareGameTestQuests }

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def props = [minecraft_version: minecraft_version,
                 forge_version: forge_version,
                 mod_id: mod_id,
                 mod_name: mod_name,
                 mod_license: mod_license,
                 mod_version: mod_version,
                 mod_description: mod_description,
                 mod_authors: mod_authors]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.named('jar', Jar).configure {
    inputs.file(file('LICENSE'))
    from('LICENSE') { rename { "LICENSE_${mod_id}" } }
}
jar.finalizedBy('reobfJar')
