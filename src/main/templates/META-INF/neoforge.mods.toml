modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://x.com/kuronami333"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="logo.png"
displayURL="https://www.curseforge.com/minecraft/mc-mods/claim-quest"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# FTB Quests: the task type this mod registers lives in the quest editor.
# Optional so the jar still loads in packs that dropped FTB Quests — the mod
# then registers nothing and stays inert (guarded by ModList in commonSetup).
[[dependencies.${mod_id}]]
    modId="ftbquests"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# FTB Chunks: the claim events that feed task progress. Without it the task
# type still registers (quest files keep parsing) but never progresses.
[[dependencies.${mod_id}]]
    modId="ftbchunks"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
